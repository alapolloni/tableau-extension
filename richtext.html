<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Rich Text Formatter</title>
  <script src="tableau.extensions.1.latest.min.js"></script>
  <style>
    html, body {
      margin: 0;
      padding: 8px;
      height: 100%;
      box-sizing: border-box;
      font-family: -apple-system, "Segoe UI", Arial, sans-serif;
      overflow: hidden;
    }
    #output {
      width: 100%;
      height: 100%;
      overflow: auto;
      word-wrap: break-word;
      white-space: pre-wrap; /* keeps line breaks from the source text */
    }
    /* Default styles applied by the markup rules below - tweak freely */
    .num   { font-weight: 700; }
    .kw    { font-style: italic; }
    .big   { font-size: 1.3em; font-weight: 700; }
    /* DEBUG: small always-on version badge so we can confirm a reload
       picked up the latest file, independent of what #output shows. */
    #debug-version {
      position: fixed;
      top: 2px;
      right: 4px;
      font-size: 9px;
      color: #999;
      background: rgba(255,255,255,0.7);
      padding: 1px 3px;
      z-index: 9999;
    }
  </style>
</head>
<body>
  <div id="debug-version"></div>
  <div id="output">Waiting for data&hellip;</div>
  <script src="richtext.js"></script>
</body>
</html>
